<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>安全知识竞赛 - 完整版</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family: system-ui, 'Segoe UI', 'PingFang SC', sans-serif; background:#0b0f17; color:#e2e8f0; padding:16px; }
        .container { max-width:1400px; margin:0 auto; }
        .hidden { display:none !important; }
        .btn { padding:8px 18px; border-radius:40px; font-weight:bold; border:none; cursor:pointer; transition:0.1s; }
        .btn-primary { background:#f0c040; color:#1e1a0a; }
        .btn-danger { background:#ef4444; color:white; }
        .btn-success { background:#10b981; color:white; }
        .btn-outline { background:transparent; border:1px solid #64748b; color:#cbd5e1; }
        .btn:active { transform:scale(0.96); }
        .login-panel, .admin-panel, .host-panel, .player-panel { background:#111827; border-radius:32px; padding:24px; margin-bottom:20px; }
        .team-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:10px; margin-top:16px; }
        .team-card { background:#1a1f2e; border-radius:20px; padding:8px; text-align:center; border-left:4px solid; transition:0.2s; }
        .team-card.highlight { transform:scale(1.02); box-shadow:0 0 0 2px #f0c040; }
        .score-big { font-size:2rem; font-weight:800; }
        .question-area { background:#0f172a; border-radius:28px; padding:20px; margin:16px 0; }
        .q-text { font-size:2rem; font-weight:700; margin:12px 0; word-break:break-word; }
        .options { display:flex; flex-direction:column; gap:12px; margin-top:16px; }
        .option { background:#1e293b; border-radius:60px; padding:14px 20px; font-size:1.2rem; cursor:pointer; transition:0.1s; }
        .option:active { transform:scale(0.98); background:#334155; }
        .option.disabled { opacity:0.5; pointer-events:none; }
        .buzz-btn { background:radial-gradient(circle at 30%20%, #f0c040, #d97706); border:none; border-radius:120px; padding:20px; font-size:2rem; font-weight:900; width:100%; margin:20px 0; cursor:pointer; }
        .buzz-btn.disabled { opacity:0.5; pointer-events:none; }
        .timer { font-size:1.8rem; font-weight:bold; color:#f0c040; text-align:center; margin:10px 0; font-family: monospace; background:#00000066; padding:8px; border-radius:60px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1e293b; border:3px solid #f0c040; padding:12px 28px; border-radius:60px; z-index:2000; animation:fadeOut 3s forwards; font-weight:bold; font-size:1.2rem; box-shadow:0 0 20px rgba(0,0,0,0.5); color:#fde68a; }
        @keyframes fadeOut { 0%{opacity:1; transform:translateX(-50%) translateY(0);} 80%{opacity:1;} 100%{opacity:0; transform:translateX(-50%) translateY(-20px); visibility:hidden;} }
        .score-table { width:100%; border-collapse:collapse; }
        .score-table th, .score-table td { border:1px solid #334155; padding:8px; text-align:center; }
        .phase-tip { font-size:1.5rem; font-weight:bold; text-align:center; margin:8px 0; color:#f0c040; }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    let role = urlParams.get('role');
    let ws = null;
    let gameState = null;
    let currentPlayer = null;
    let timerInterval = null;

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${location.host}`;

    function isCountdownActive() {
        if (!gameState) return false;
        const act = gameState.currentActivity;
        if (act === 'rush') {
            const rush = gameState.rush;
            if (rush.roundState === 'RUSHING' && rush.rushEndTime > Date.now()) return true;
            if (rush.roundState === 'ANSWERING' && rush.answerEndTime > Date.now()) return true;
        } else if (act === 'mutual') {
            const mutual = gameState.mutual;
            if (mutual.roundActive && mutual.answerEndTime > Date.now()) return true;
        }
        return false;
    }

    function manageTimer() {
        if (isCountdownActive()) {
            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    if ((role === 'player' || role === 'host') && isCountdownActive()) render();
                    else if (!isCountdownActive() && timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                }, 100);
            }
        } else {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            if (role === 'player' || role === 'host') render();
        }
    }

    function connectWebSocket() {
        ws = new WebSocket(wsUrl);
        ws.onopen = () => console.log('WebSocket 已连接');
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'STATE') {
                gameState = data.state;
                render();
                manageTimer();
            } else if (data.type === 'ANSWER_RESULT') {
                showToast(data.result.msg);
                render();
                manageTimer();
            }
        };
        ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    function sendMessage(msg) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    function showToast(msg) {
        let t = document.createElement('div');
        t.className = 'toast';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // 登录界面
    function renderLogin() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        document.getElementById('app').innerHTML = `
            <div class="login-panel" style="max-width:400px; margin:10vh auto;">
                <h1>安全知识竞赛</h1>
                <div style="margin:24px 0;">
                    <button class="btn btn-primary" id="hostBtn" style="width:100%; margin-bottom:12px;">🎤 主持人</button>
                    <button class="btn btn-outline" id="adminBtn" style="width:100%; margin-bottom:12px;">📊 管理员</button>
                    <button class="btn btn-outline" id="playerBtn" style="width:100%;">👥 参赛选手</button>
                </div>
                <div id="passwordDiv" class="hidden">
                    <input type="password" id="password" placeholder="密码" style="width:100%; padding:12px; border-radius:40px; margin-bottom:12px;">
                    <button class="btn btn-primary" id="submitPwd">确认</button>
                </div>
            </div>
        `;
        document.getElementById('hostBtn').onclick = () => showPassword('host');
        document.getElementById('adminBtn').onclick = () => showPassword('admin');
        document.getElementById('playerBtn').onclick = () => { window.location.href = '?role=player'; };
        function showPassword(r) {
            const div = document.getElementById('passwordDiv');
            div.classList.remove('hidden');
            document.getElementById('submitPwd').onclick = () => {
                const pwd = document.getElementById('password').value;
                if (pwd === '123') window.location.href = `?role=${r}`;
                else alert('密码错误');
            };
        }
    }

    // 主持人界面
    function renderHost() {
        const act = gameState.currentActivity;
        const rush = gameState.rush;
        const mutual = gameState.mutual;
        let content = `
            <div class="host-panel">
                <div style="display:flex; justify-content:space-between;">
                    <h2>🎙️ 主持人控制台</h2>
                    <button class="btn btn-outline" id="logoutBtn">退出</button>
                </div>
                <div style="margin:16px 0;">
                    <button class="btn ${act==='rush'?'btn-primary':'btn-outline'}" id="selectRush">🏁 抢答活动</button>
                    <button class="btn ${act==='mutual'?'btn-primary':'btn-outline'}" id="selectMutual">🔄 互问互答</button>
                </div>
        `;
        if (act === 'rush') {
            let timerDisplay = '';
            if (rush.roundState === 'RUSHING' && rush.rushEndTime) {
                const remain = Math.max(0, (rush.rushEndTime - Date.now()) / 1000);
                timerDisplay = `<div class="timer">⏰ 抢答倒计时: ${remain.toFixed(1)} 秒</div>`;
            } else if (rush.roundState === 'ANSWERING' && rush.answerEndTime) {
                const remain = Math.max(0, (rush.answerEndTime - Date.now()) / 1000);
                timerDisplay = `<div class="timer">✏️ 答题倒计时: ${remain.toFixed(1)} 秒</div>`;
            }
            content += `
                <div class="question-area">
                    <div>当前状态: ${rush.roundState==='IDLE'?'空闲':rush.roundState==='RUSHING'?'抢答中':rush.roundState==='ANSWERING'?'答题中':'已结束'}</div>
                    ${rush.currentQuestion ? `<div class="q-text">${rush.currentQuestion.question}</div><div class="options">${rush.currentQuestion.options.map((opt,i)=>`<div class="option">${String.fromCharCode(65+i)}. ${opt}</div>`).join('')}</div>` : '<div>暂无题目</div>'}
                    ${timerDisplay}
                    <button class="btn btn-primary" id="startRushBtn" ${rush.roundState!=='IDLE'?'disabled':''}>🎲 开始抢答 (40秒)</button>
                </div>
            `;
        } else if (act === 'mutual') {
            const currentDraw = gameState.players.find(p=>p.id===mutual.currentDrawTeamId);
            const currentAnswer = gameState.players.find(p=>p.id===mutual.currentAnswerTeamId);
            let answerTimer = '';
            if (mutual.roundActive && mutual.answerEndTime) {
                const remain = Math.max(0, (mutual.answerEndTime - Date.now()) / 1000);
                answerTimer = `<div class="timer">⏰ 答题倒计时: ${remain.toFixed(1)} 秒</div>`;
            }
            content += `
                <div class="question-area">
                    <div>📌 当前抽题队伍: ${currentDraw?.name}</div>
                    <div>🎯 待回答队伍: ${currentAnswer?.name}</div>
                    ${mutual.roundActive ? `<div class="q-text">${mutual.currentQuestion?.question}</div><div class="options">${mutual.currentQuestion?.options.map((opt,i)=>`<div class="option">${String.fromCharCode(65+i)}. ${opt}</div>`).join('')}</div>${answerTimer}` : '<div>未开始一轮问答，请当前抽题队伍点击抽取题目</div>'}
                    <button class="btn btn-primary" id="drawQuestionBtn" ${mutual.roundActive ? 'disabled' : ''}>📖 抽取题目 (轮到抽题队时有效)</button>
                </div>
            `;
        }
        content += `<div class="team-grid" id="hostTeamScores"></div></div>`;
        document.getElementById('app').innerHTML = content;

        const grid = document.getElementById('hostTeamScores');
        if (grid) grid.innerHTML = gameState.players.map(p => `<div class="team-card" style="border-left-color:${p.color}"><div>${p.emoji} ${p.name}</div><div class="score-big">${p.score}</div></div>`).join('');

        // 活动切换确认
        document.getElementById('selectRush').onclick = () => {
            if (gameState.currentActivity !== 'rush' && confirm('确认切换到抢答活动吗？当前互问互答进度将重置')) {
                sendMessage({ type: 'HOST_ACTION', action: 'selectActivity', payload: 'rush' });
            }
        };
        document.getElementById('selectMutual').onclick = () => {
            if (gameState.currentActivity !== 'mutual' && confirm('确认切换到互问互答活动吗？当前抢答活动进度将重置')) {
                sendMessage({ type: 'HOST_ACTION', action: 'selectActivity', payload: 'mutual' });
            }
        };
        if (act === 'rush') {
            document.getElementById('startRushBtn').onclick = () => sendMessage({ type: 'HOST_ACTION', action: 'startRush' });
        } else if (act === 'mutual') {
            document.getElementById('drawQuestionBtn').onclick = () => {
                const drawTeamId = gameState.mutual.currentDrawTeamId;
                sendMessage({ type: 'HOST_ACTION', action: 'drawQuestion', payload: { drawTeamId } });
            };
        }
        document.getElementById('logoutBtn').onclick = () => { window.location.href = '/'; };
    }

    // 选手界面
    function renderPlayer() {
        if (!currentPlayer) {
            if (!gameState) return;
            const teams = gameState.players;
            document.getElementById('app').innerHTML = `
                <div class="login-panel" style="max-width:400px; margin:10vh auto;">
                    <h2>选手登录</h2>
                    <div class="input-group"><label>姓名</label><input id="playerName" placeholder="请输入姓名"></div>
                    <div class="input-group"><label>队伍</label><select id="teamSelect">${teams.map(t=>`<option value="${t.id}">${t.emoji} ${t.name}</option>`).join('')}</select></div>
                    <button class="btn btn-primary" id="joinBtn">进入赛场</button>
                </div>
            `;
            document.getElementById('joinBtn').onclick = () => {
                const name = document.getElementById('playerName').value.trim();
                if (!name) return alert('请输入姓名');
                const teamId = parseInt(document.getElementById('teamSelect').value);
                currentPlayer = { id: teamId, name };
                render();
            };
            return;
        }

        const player = gameState.players.find(p=>p.id===currentPlayer.id);
        if (!player) return;
        const act = gameState.currentActivity;
        const rush = gameState.rush;
        const mutual = gameState.mutual;

        let canBuzz = false;
        let canAnswer = false;
        let questionHtml = '<div>等待主持人开始活动...</div>';
        let optionsHtml = '';
        let timerHtml = '';
        let specialMsg = '';
        let showBuzzBtn = (act === 'rush'); // 只有抢答活动显示抢答按钮

        // 阶段提示
        let phaseTip = '';
        if (act === 'rush') phaseTip = '<div class="phase-tip">⚡ 当前活动：抢答竞赛 ⚡</div>';
        else if (act === 'mutual') phaseTip = '<div class="phase-tip">🤝 当前活动：互问互答 🤝</div>';

        if (act === 'rush') {
            if (rush.currentQuestion && rush.roundState !== 'IDLE') {
                questionHtml = `<div class="q-text">${rush.currentQuestion.question}</div>`;
                const opts = rush.currentQuestion.options;
                optionsHtml = `<div class="options" id="optionsContainer">${opts.map((opt,i)=>`<div class="option" data-opt="${i}">${String.fromCharCode(65+i)}. ${opt}</div>`).join('')}</div>`;
                const isRushing = (rush.roundState === 'RUSHING');
                const isAnswering = (rush.roundState === 'ANSWERING');
                canBuzz = isRushing && rush.buzzerPlayerId === null;
                canAnswer = isAnswering && rush.buzzerPlayerId === player.id;
                if (isRushing && rush.rushEndTime) {
                    const remain = Math.max(0, (rush.rushEndTime - Date.now()) / 1000);
                    timerHtml = `<div class="timer">🔔 抢答倒计时: ${remain.toFixed(1)} 秒</div>`;
                }
                if (isAnswering && rush.buzzerPlayerId === player.id && rush.answerEndTime) {
                    const remain = Math.max(0, (rush.answerEndTime - Date.now()) / 1000);
                    timerHtml = `<div class="timer">✏️ 答题倒计时: ${remain.toFixed(1)} 秒</div>`;
                }
                if (rush.buzzerPlayerId !== null && rush.buzzerPlayerId !== player.id) {
                    const buzzer = gameState.players.find(p=>p.id===rush.buzzerPlayerId);
                    specialMsg = `<div style="color:#f0c040;">⚠️ ${buzzer?.name} 已抢答，正在答题中...</div>`;
                }
            } else {
                questionHtml = '<div>等待主持人开始抢答...</div>';
            }
        } else if (act === 'mutual') {
            if (mutual.phaseEnded) {
                specialMsg = `<div class="phase-tip" style="color:#10b981;">🏆 互问互答阶段已结束！所有团队已完成2次问答 🏆</div>`;
                questionHtml = '<div>感谢参与，请等待主持人切换活动</div>';
            } else if (mutual.roundActive) {
                const isAnsweringTeam = (mutual.answeringPlayerId === player.id);
                questionHtml = `<div class="q-text">${mutual.currentQuestion?.question}</div>`;
                const opts = mutual.currentQuestion?.options || [];
                optionsHtml = `<div class="options" id="optionsContainer">${opts.map((opt,i)=>`<div class="option" data-opt="${i}">${String.fromCharCode(65+i)}. ${opt}</div>`).join('')}</div>`;
                if (isAnsweringTeam && mutual.answerEndTime) {
                    const remain = Math.max(0, (mutual.answerEndTime - Date.now()) / 1000);
                    timerHtml = `<div class="timer">⌛ 答题倒计时: ${remain.toFixed(1)} 秒</div>`;
                    canAnswer = true;
                    specialMsg = `<div style="color:#10b981;">🎤 轮到你的队伍回答！点击选项提交答案</div>`;
                } else if (!isAnsweringTeam) {
                    specialMsg = `<div style="color:#f59e0b;">⏳ 当前由 ${gameState.players.find(p=>p.id===mutual.answeringPlayerId)?.name} 队伍回答</div>`;
                }
            } else {
                const currentDraw = gameState.players.find(p=>p.id===mutual.currentDrawTeamId);
                const nextAnswer = gameState.players.find(p=>p.id===mutual.currentAnswerTeamId);
                specialMsg = `<div>当前抽题队伍: ${currentDraw?.name} | 待回答队伍: ${nextAnswer?.name}</div>`;
                if (mutual.currentDrawTeamId === player.id) {
                    specialMsg += `<button class="btn btn-primary" id="drawBtn" style="margin-top:8px;">📖 抽取题目</button>`;
                }
            }
        }

        const scoreBoard = `<div class="team-grid" style="grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); margin-top:10px;">${gameState.players.map(p=>`<div class="team-card" style="border-left-color:${p.color}; padding:4px;"><div>${p.emoji}</div><div style="font-size:0.9rem;">${p.score}</div></div>`).join('')}</div>`;

        const html = `
            <div class="player-panel">
                <div style="display:flex; justify-content:space-between;">
                    <h2>👤 ${player.emoji} ${player.name} (${currentPlayer.name})</h2>
                    <button class="btn btn-outline" id="logoutBtn">退出</button>
                </div>
                ${phaseTip}
                <div class="question-area">
                    ${questionHtml}
                    ${optionsHtml}
                    ${timerHtml}
                    ${specialMsg}
                </div>
                ${showBuzzBtn ? `<button class="buzz-btn ${canBuzz?'':'disabled'}" id="buzzBtn" ${!canBuzz?'disabled':''}>⚡ 抢答</button>` : ''}
                ${scoreBoard}
            </div>
        `;
        document.getElementById('app').innerHTML = html;

        if (showBuzzBtn && canBuzz) {
            document.getElementById('buzzBtn').onclick = () => {
                sendMessage({ type: 'PLAYER_RUSH', playerId: player.id });
                document.getElementById('buzzBtn').disabled = true;
            };
        }
        const optionsDiv = document.getElementById('optionsContainer');
        if (optionsDiv && canAnswer) {
            const opts = document.querySelectorAll('.option');
            opts.forEach(opt => {
                opt.onclick = () => {
                    const idx = parseInt(opt.dataset.opt);
                    sendMessage({ type: 'PLAYER_ANSWER', playerId: player.id, answerIndex: idx });
                    opts.forEach(o => o.classList.add('disabled'));
                };
            });
        }
        const drawBtn = document.getElementById('drawBtn');
        if (drawBtn) {
            drawBtn.onclick = () => {
                sendMessage({ type: 'HOST_ACTION', action: 'drawQuestion', payload: { drawTeamId: player.id } });
            };
        }
        document.getElementById('logoutBtn').onclick = () => { window.location.href = '/'; };
    }

    // 管理员界面
    function renderAdmin() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        if (!gameState) return;
        const teams = gameState.players;
        const html = `
            <div class="admin-panel">
                <h2>📊 管理员 - 分数总览</h2>
                <table class="score-table">
                    <thead><tr><th>队伍</th><th>分数</th></tr></thead>
                    <tbody>${teams.map(p=>`<tr><td>${p.emoji} ${p.name}</td><td>${p.score}</td></tr>`).join('')}</tbody>
                </table>
                <button class="btn btn-primary" id="exportExcel">📎 导出 Excel</button>
                <button class="btn btn-outline" id="logoutAdmin">退出</button>
            </div>
        `;
        document.getElementById('app').innerHTML = html;
        document.getElementById('exportExcel').onclick = () => {
            let csv = "队伍,分数\n" + teams.map(p=>`${p.name},${p.score}`).join("\n");
            const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv;charset=utf-8;'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '竞赛分数.csv';
            link.click();
        };
        document.getElementById('logoutAdmin').onclick = () => { window.location.href = '/'; };
    }

    function render() {
        if (!gameState) return;
        if (role === 'host') renderHost();
        else if (role === 'player') renderPlayer();
        else if (role === 'admin') renderAdmin();
        else renderLogin();
    }

    connectWebSocket();
    manageTimer();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>知识竞赛 - 主持人与选手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, 'Segoe UI', 'PingFang SC', sans-serif; background: #0b0f17; color: #e2e8f0; padding: 16px; }
        .container { max-width: 1300px; margin: 0 auto; }
        .hidden { display: none !important; }
        .btn { padding: 8px 18px; border-radius: 40px; font-weight: bold; border: none; cursor: pointer; transition: 0.1s; }
        .btn-primary { background: #f0c040; color: #1e1a0a; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-outline { background: transparent; border: 1px solid #64748b; color: #cbd5e1; }
        .btn:active { transform: scale(0.96); }
        /* 主持人样式 */
        .host-layout .stage-card { background: #111827; border-radius: 28px; padding: 20px; margin-bottom: 20px; border: 2px solid #334155; transition: 0.2s; }
        .host-layout .stage-card.state-ready { border-color: #f59e0b; }
        .host-layout .stage-card.state-buzzed { border-color: #ef4444; }
        .host-layout .stage-card.state-correct { border-color: #10b981; }
        .host-layout .stage-card.state-wrong { border-color: #ef4444; }
        .q-text { font-size: 1.5rem; font-weight: 700; margin: 12px 0; word-break: break-word; }
        .options-grid { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
        .opt-item { background: #1a1f2e; border-radius: 60px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
        .opt-label { width: 32px; height: 32px; background: #2d3a5e; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; }
        .opt-item.highlight-correct { border: 2px solid #10b981; background: rgba(16,185,129,0.2); }
        .teams-grid-host { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; background: #0f172a; border-radius: 24px; padding: 16px; max-height: 50vh; overflow-y: auto; }
        .team-card-host { background: #1a1f2e; border-radius: 20px; padding: 8px; text-align: center; border-left: 4px solid; }
        .team-score { font-size: 1.8rem; font-weight: 800; }
        .control-bar { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; justify-content: center; }
        .question-nav { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
        /* 选手样式 */
        .player-view { max-width: 500px; margin: 0 auto; text-align: center; }
        .player-score-card { background: #111827; border-radius: 40px; padding: 16px; margin-bottom: 20px; }
        .big-buzz-btn { background: radial-gradient(circle at 30% 20%, #f0c040, #d97706); border: none; border-radius: 120px; padding: 28px 20px; font-size: 2.2rem; font-weight: 900; width: 100%; margin: 20px 0; cursor: pointer; transition: 0.05s linear; }
        .big-buzz-btn:active { transform: scale(0.96); }
        .big-buzz-btn.disabled { opacity: 0.4; pointer-events: none; background: #555; }
        .login-panel { background: #111827; border-radius: 32px; padding: 32px; max-width: 480px; margin: 10vh auto; text-align: center; }
        .input-group { margin: 16px 0; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; }
        select, input { width: 100%; padding: 12px; border-radius: 40px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 1rem; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid #f0c040; padding: 8px 20px; border-radius: 30px; z-index: 2000; animation: fadeOut 2s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    // ==================== 解析 URL 角色 ====================
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role'); // 'host' 或 'player'
    let ws = null;
    let currentPlayer = null; // 选手信息 { id, name }
    let gameState = null;

    // ==================== WebSocket 连接（自适应 wss/ws） ====================
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}`;
    function connectWebSocket() {
        ws = new WebSocket(wsUrl);
        ws.onopen = () => console.log('WebSocket 已连接');
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'STATE') {
                gameState = data.state;
                render();
            }
        };
        ws.onclose = () => setTimeout(connectWebSocket, 3000);
        ws.onerror = (err) => console.error('WebSocket 错误', err);
    }

    function sendMessage(msg) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    // 主持人发送状态更新
    function hostUpdate(updates) {
        Object.assign(gameState, updates);
        sendMessage({ type: 'HOST_ACTION', state: gameState });
    }

    // 获取当前题目
    function getCurrentQ() {
        if (!gameState || gameState.currentQIndex >= gameState.questions.length) return null;
        return gameState.questions[gameState.currentQIndex];
    }

    // ==================== 主持人界面渲染 ====================
    function renderHost() {
        const q = getCurrentQ();
        const qStatus = q ? gameState.questionStatus[q.id] : null;
        const isQDone = qStatus === 'done' || qStatus === 'skipped';
        const round = gameState.roundState;

        let statusText = '';
        if (round === 'IDLE') statusText = '⚡ 待出题';
        else if (round === 'SHOWING') statusText = '📋 题目已展示，可开始抢答';
        else if (round === 'READY_TO_BUZZ') statusText = `🔔 抢答倒计时 ${Math.ceil(gameState.buzzRemain)}s`;
        else if (round === 'BUZZED') {
            const p = gameState.players.find(p => p.id === gameState.buzzerPlayerId);
            statusText = `🏆 ${p?.name} 抢答成功！请判定`;
        }
        else if (round === 'ANSWERING') statusText = `⏱️ 答题倒计时 ${Math.ceil(gameState.answerRemain)}s`;
        else if (round === 'JUDGED') statusText = '✅ 已判定，即将下一题';
        else if (round === 'TIMEOUT') statusText = '⏰ 抢答超时，跳过本题';

        let stageClass = '';
        if (round === 'READY_TO_BUZZ') stageClass = 'state-ready';
        else if (round === 'BUZZED') stageClass = 'state-buzzed';
        else if (round === 'JUDGED') {
            // 简单根据最后判定显示，实际可省略
        }

        const html = `
            <div class="host-layout">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h2>🎙️ 主持人控制台</h2>
                    <button class="btn btn-outline" id="logoutBtn">退出</button>
                </div>
                <div class="stage-card ${stageClass}">
                    <div>第${gameState.currentQIndex+1}题 / 共${gameState.questions.length}题</div>
                    <div class="q-text">${q ? q.question : '🏁 比赛结束'}</div>
                    <div class="options-grid" id="hostOptions"></div>
                    <div style="font-weight:bold; margin:8px 0;">${statusText}</div>
                </div>
                <div class="teams-grid-host" id="hostTeamsGrid"></div>
                <div class="control-bar">
                    <button class="btn btn-primary" id="showQBtn" ${(!q || isQDone) ? 'disabled' : ''}>📋 展示题目</button>
                    <button class="btn btn-primary" id="startBuzzBtn" ${round !== 'SHOWING' ? 'disabled' : ''}>🔔 开始抢答</button>
                    <button class="btn btn-success" id="correctBtn" ${(round !== 'BUZZED' && round !== 'ANSWERING') ? 'disabled' : ''}>✅ 正确</button>
                    <button class="btn btn-danger" id="wrongBtn" ${(round !== 'BUZZED' && round !== 'ANSWERING') ? 'disabled' : ''}>❌ 错误</button>
                    <button class="btn btn-outline" id="skipBtn" ${(round !== 'IDLE' && round !== 'SHOWING') ? 'disabled' : ''}>⏭ 跳过</button>
                    <button class="btn btn-outline" id="resetBtn">🔄 重置全部</button>
                </div>
                <div class="question-nav" id="hostNav"></div>
            </div>
        `;
        document.getElementById('app').innerHTML = html;

        // 渲染选项
        if (q && q.options) {
            const optsDiv = document.getElementById('hostOptions');
            const labels = q.type === '判断题' ? ['✅ 正确','❌ 错误'] : ['A','B','C','D'].slice(0, q.options.length);
            optsDiv.innerHTML = q.options.map((opt, i) => `<div class="opt-item" data-opt="${i}"><span class="opt-label">${labels[i]}</span>${opt}</div>`).join('');
            if (round === 'JUDGED' && q.answer !== undefined) {
                const items = document.querySelectorAll('#hostOptions .opt-item');
                if (items[q.answer]) items[q.answer].classList.add('highlight-correct');
            }
        }

        // 队伍积分榜
        const teamsGrid = document.getElementById('hostTeamsGrid');
        teamsGrid.innerHTML = gameState.players.map(p => `
            <div class="team-card-host" style="border-left-color:${p.color}">
                <div>${p.emoji} ${p.name}</div>
                <div class="team-score" style="color:${p.color}">${p.score}</div>
            </div>
        `).join('');

        // 题目导航
        const navDiv = document.getElementById('hostNav');
        navDiv.innerHTML = gameState.questions.map((_, i) => {
            let cls = '';
            if (i === gameState.currentQIndex) cls = 'btn-primary';
            else if (gameState.questionStatus[gameState.questions[i].id] === 'done') cls = 'btn-success';
            else if (gameState.questionStatus[gameState.questions[i].id] === 'skipped') cls = 'btn-outline';
            else cls = 'btn-outline';
            return `<button class="btn ${cls}" style="padding:4px 12px;" data-idx="${i}">${i+1}</button>`;
        }).join('');

        // 绑定事件
        document.getElementById('showQBtn').onclick = () => {
            if (!q || isQDone) return;
            hostUpdate({ roundState: 'SHOWING' });
        };
        document.getElementById('startBuzzBtn').onclick = () => {
            if (round !== 'SHOWING') return;
            hostUpdate({ roundState: 'READY_TO_BUZZ', buzzRemain: gameState.buzzTimeoutSec });
            let remain = gameState.buzzTimeoutSec;
            const start = Date.now();
            const timer = setInterval(() => {
                if (gameState.roundState !== 'READY_TO_BUZZ') { clearInterval(timer); return; }
                const elapsed = (Date.now() - start) / 1000;
                let rem = Math.max(0, gameState.buzzTimeoutSec - elapsed);
                if (rem <= 0) {
                    clearInterval(timer);
                    hostUpdate({ roundState: 'TIMEOUT' });
                } else {
                    hostUpdate({ buzzRemain: rem });
                }
            }, 100);
        };
        document.getElementById('correctBtn').onclick = () => {
            if (round !== 'BUZZED' && round !== 'ANSWERING') return;
            const p = gameState.players.find(p => p.id === gameState.buzzerPlayerId);
            if (p) {
                p.score += gameState.correctPoints;
                if (q && !gameState.questionStatus[q.id]) gameState.questionStatus[q.id] = 'done';
                hostUpdate({ roundState: 'JUDGED', players: gameState.players, questionStatus: gameState.questionStatus });
                setTimeout(() => {
                    if (gameState.currentQIndex < gameState.questions.length - 1) {
                        hostUpdate({ currentQIndex: gameState.currentQIndex + 1, roundState: 'IDLE', buzzerPlayerId: null });
                    } else {
                        hostUpdate({ roundState: 'IDLE' });
                    }
                }, 2000);
            }
        };
        document.getElementById('wrongBtn').onclick = () => {
            if (round !== 'BUZZED' && round !== 'ANSWERING') return;
            const p = gameState.players.find(p => p.id === gameState.buzzerPlayerId);
            if (p) {
                p.score -= gameState.wrongPoints;
                if (q && !gameState.questionStatus[q.id]) gameState.questionStatus[q.id] = 'done';
                hostUpdate({ roundState: 'JUDGED', players: gameState.players, questionStatus: gameState.questionStatus });
                setTimeout(() => {
                    if (gameState.currentQIndex < gameState.questions.length - 1) {
                        hostUpdate({ currentQIndex: gameState.currentQIndex + 1, roundState: 'IDLE', buzzerPlayerId: null });
                    } else {
                        hostUpdate({ roundState: 'IDLE' });
                    }
                }, 2000);
            }
        };
        document.getElementById('skipBtn').onclick = () => {
            if (round !== 'IDLE' && round !== 'SHOWING') return;
            if (q && !gameState.questionStatus[q.id]) gameState.questionStatus[q.id] = 'skipped';
            let nextIdx = gameState.currentQIndex + 1;
            if (nextIdx >= gameState.questions.length) nextIdx = gameState.currentQIndex;
            hostUpdate({ currentQIndex: nextIdx, roundState: 'IDLE', buzzerPlayerId: null, questionStatus: gameState.questionStatus });
        };
        document.getElementById('resetBtn').onclick = () => {
            if (confirm('重置所有分数和进度？')) {
                location.reload();  // 简单重置：刷新页面，后端状态也会重置（因为内存存储）
            }
        };
        document.getElementById('logoutBtn').onclick = () => {
            window.location.href = window.location.pathname;
        };
        // 导航点击
        document.querySelectorAll('#hostNav button').forEach(btn => {
            btn.onclick = () => {
                const idx = parseInt(btn.dataset.idx);
                if (round === 'READY_TO_BUZZ' || round === 'BUZZED' || round === 'ANSWERING') {
                    alert('请先结束本回合');
                    return;
                }
                hostUpdate({ currentQIndex: idx, roundState: 'IDLE', buzzerPlayerId: null });
            };
        });
    }

    // ==================== 选手界面渲染 ====================
    function renderPlayer() {
        if (!currentPlayer) return;
        const player = gameState.players.find(p => p.id === currentPlayer.id);
        if (!player) return;
        const q = getCurrentQ();
        const round = gameState.roundState;
        const showQuestion = (round !== 'IDLE'); // 只要不是空闲状态就显示题目（包括 SHOWING 之后）
        const canBuzz = (round === 'READY_TO_BUZZ');

        let questionDisplay = '<div style="text-align:center; padding:40px;">📢 等待主持人开始比赛...</div>';
        let optionsHtml = '';
        if (q && showQuestion) {
            questionDisplay = `<div class="q-text">${q.question}</div>`;
            if (q.options) {
                const labels = q.type === '判断题' ? ['正确','错误'] : ['A','B','C','D'].slice(0, q.options.length);
                optionsHtml = `<div class="options-grid" id="playerOptionsList">` +
                    q.options.map((opt, i) => `<div class="opt-item"><span class="opt-label">${labels[i]}</span>${opt}</div>`).join('') +
                    `</div>`;
                if (round === 'JUDGED' && q.answer !== undefined) {
                    setTimeout(() => {
                        const items = document.querySelectorAll('#playerOptionsList .opt-item');
                        if (items[q.answer]) items[q.answer].classList.add('highlight-correct');
                    }, 10);
                }
            }
        } else if (!q) {
            questionDisplay = '<div>🏁 比赛已结束</div>';
        }

        let statusMsg = '';
        if (round === 'READY_TO_BUZZ') statusMsg = '🔔 抢答开放！点击下方按钮！';
        else if (round === 'BUZZED') statusMsg = gameState.buzzerPlayerId === player.id ? '🎉 抢答成功！等待主持人判定' : '⏳ 已有队伍抢答';
        else if (round === 'ANSWERING') statusMsg = gameState.buzzerPlayerId === player.id ? '🎤 请回答，主持人将判定' : '等待判定';
        else if (round === 'SHOWING') statusMsg = '📋 题目已展示，等待抢答开始';
        else statusMsg = '⚡ 等待主持人开始比赛';

        const html = `
            <div class="player-view">
                <div class="player-score-card">
                    <div>${player.emoji} ${player.name}</div>
                    <div style="font-size:2.5rem; font-weight:800;">${player.score}</div>
                    <div style="color:#aaa;">选手: ${currentPlayer.name}</div>
                </div>
                <div class="stage-card" style="background:#0f172a;">
                    ${questionDisplay}
                    ${optionsHtml}
                    <div style="margin:10px 0;">${statusMsg}</div>
                </div>
                <button id="playerBuzzBtn" class="big-buzz-btn ${!canBuzz ? 'disabled' : ''}" ${!canBuzz ? 'disabled' : ''}>⚡ 抢答</button>
                <button class="btn btn-outline" id="playerLogout" style="margin-top:12px;">返回登录</button>
            </div>
        `;
        document.getElementById('app').innerHTML = html;

        document.getElementById('playerBuzzBtn').onclick = () => {
            if (canBuzz) {
                sendMessage({ type: 'PLAYER_BUZZ', playerId: player.id });
                document.getElementById('playerBuzzBtn').disabled = true;
                document.getElementById('playerBuzzBtn').classList.add('disabled');
            }
        };
        document.getElementById('playerLogout').onclick = () => {
            window.location.href = window.location.pathname;
        };
    }

    // ==================== 选手登录界面 ====================
    function renderLogin() {
        if (!gameState) {
            document.getElementById('app').innerHTML = '<div style="text-align:center; margin-top:50px;">加载中...</div>';
            return;
        }
        const teams = gameState.players;
        const html = `
            <div class="login-panel">
                <h1>🏆 知识竞赛</h1>
                <div class="input-group">
                    <label>你的姓名</label>
                    <input type="text" id="playerName" placeholder="请输入真实姓名" maxlength="20">
                </div>
                <div class="input-group">
                    <label>选择队伍</label>
                    <select id="teamSelect">
                        ${teams.map(t => `<option value="${t.id}">${t.emoji} ${t.name}</option>`).join('')}
                    </select>
                </div>
                <button class="btn btn-primary" id="joinBtn" style="width:100%; margin-top:16px;">🚀 进入赛场</button>
            </div>
        `;
        document.getElementById('app').innerHTML = html;
        document.getElementById('joinBtn').onclick = () => {
            const name = document.getElementById('playerName').value.trim();
            if (!name) { alert('请输入姓名'); return; }
            const teamId = parseInt(document.getElementById('teamSelect').value);
            currentPlayer = { id: teamId, name: name };
            render();
        };
    }

    // ==================== 主渲染分发 ====================
    function render() {
        if (!gameState) return;
        if (role === 'host') {
            renderHost();
        } else if (role === 'player') {
            if (currentPlayer) {
                renderPlayer();
            } else {
                renderLogin();
            }
        } else {
            // 无角色参数，显示选择
            document.getElementById('app').innerHTML = `
                <div class="login-panel">
                    <h1>🏆 知识竞赛</h1>
                    <div style="display:flex; gap:20px; justify-content:center; margin-top:24px;">
                        <button id="goHost" class="btn btn-primary">🎤 主持人</button>
                        <button id="goPlayer" class="btn btn-outline">👥 选手加入</button>
                    </div>
                </div>
            `;
            document.getElementById('goHost').onclick = () => window.location.href = `?role=host`;
            document.getElementById('goPlayer').onclick = () => window.location.href = `?role=player`;
            return;
        }
    }

    // 启动
    connectWebSocket();
    setInterval(() => { if (gameState) render(); }, 200); // 定期刷新 UI 同步状态
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>安全知识竞赛 - 稳定版</title>
    <!-- SheetJS 用于 Excel 导出 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:system-ui,'Segoe UI','PingFang SC',sans-serif;background:#0b0f17;color:#e2e8f0;padding:16px;}
        .btn{padding:10px 22px;border-radius:40px;font-weight:bold;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:1rem;}
        .btn-primary{background:#f0c040;color:#1e1a0a;box-shadow:0 4px 12px rgba(240,192,64,0.3);}
        .btn-outline{background:transparent;border:2px solid #64748b;color:#cbd5e1;}
        .btn-danger{background:#ef4444;color:white;}
        .btn-success{background:#10b981;color:white;}
        .btn-sm{padding:6px 14px;font-size:0.9rem;}
        .btn-highlight{border-color:#f0c040!important;box-shadow:0 0 20px rgba(240,192,64,0.7)!important;transform:scale(1.02);background:rgba(240,192,64,0.15)!important;}
        .panel{background:#111827;border-radius:32px;padding:24px;margin-bottom:20px;box-shadow:0 8px 24px rgba(0,0,0,0.5);}
        .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:16px;}
        .team-card{background:#1a1f2e;border-radius:20px;padding:12px;text-align:center;border-left:6px solid;}
        .score-big{font-size:2rem;font-weight:900;}
        .question-area{background:#0f172a;border-radius:28px;padding:24px;margin:16px 0;}
        .q-text{font-size:2.8rem;font-weight:700;margin:12px 0;word-break:break-word;line-height:1.3;}
        .options{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
        .option{background:#1e293b;border-radius:60px;padding:14px 24px;font-size:1.5rem;cursor:pointer;border:2px solid transparent;text-align:left;}
        .option:active{transform:scale(0.98);background:#334155;}
        .buzz-btn{background:radial-gradient(circle at 30% 20%, #fbbf24, #d97706);border:none;border-radius:120px;padding:24px;font-size:2.2rem;font-weight:900;width:100%;margin:20px 0;cursor:pointer;color:#1e1a0a;box-shadow:0 8px 24px rgba(251,191,36,0.4);}
        .buzz-btn:active{transform:scale(0.97);}
        .buzz-btn:disabled{opacity:0.5;pointer-events:none;}
        .timer{font-size:2rem;font-weight:bold;color:#fbbf24;text-align:center;margin:12px 0;font-family:monospace;background:#00000055;padding:8px 20px;border-radius:60px;display:inline-block;}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e293b;border:3px solid #f0c040;padding:14px 30px;border-radius:60px;z-index:2000;font-weight:bold;animation:fadeOut 3.5s forwards;pointer-events:none;}
        @keyframes fadeOut{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;visibility:hidden;}}
        .result-banner{text-align:center;padding:20px;margin:16px 0;border-radius:60px;font-weight:900;font-size:2rem;animation:fadeOutResult 4s forwards;}
        .result-banner.correct{background:#10b981;color:white;border:4px solid #fbbf24;}
        .result-banner.wrong{background:#ef4444;color:white;border:4px solid #fbbf24;}
        .result-banner.buzz{background:#fbbf24;color:#1e1a0a;font-size:2.2rem;}
        .result-banner.end{background:#8b5cf6;color:white;font-size:2.5rem;border:4px solid #a78bfa;}
        @keyframes fadeOutResult{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;visibility:hidden;}}
        .phase-tip{font-size:1.6rem;font-weight:bold;text-align:center;margin:8px 0;color:#f0c040;}
        input,select,textarea{background:#1e293b;border:2px solid #475569;color:white;padding:10px 16px;border-radius:30px;width:100%;font-size:1rem;margin-bottom:10px;outline:none;}
        input:focus,select:focus,textarea:focus{border-color:#f0c040;}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000;}
        .modal-card{background:#111827;border-radius:32px;padding:24px;width:90%;max-width:500px;}
        .loading{text-align:center;padding:50px;font-size:1.5rem;color:#f0c040;}
        .hidden{display:none!important;}
        .flex-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
        .draw-anim{animation:drawBlink 0.6s infinite;}
        @keyframes drawBlink{0%{opacity:1;}50%{opacity:0.5;background:#fbbf24;color:#000;}100%{opacity:1;}}
        .member-count{background:#f0c040;color:#000;border-radius:50%;width:20px;height:20px;display:inline-block;font-size:0.7rem;font-weight:bold;line-height:20px;margin-left:4px;}
        table{width:100%;border-collapse:collapse;margin-top:12px;}
        th,td{border:1px solid #334155;padding:8px;text-align:center;}
        th{background:#1e293b;}
        .tab-btn{background:transparent;border:2px solid #475569;color:#cbd5e1;padding:8px 20px;border-radius:30px;cursor:pointer;font-weight:bold;}
        .tab-btn.active{background:#f0c040;color:#000;border-color:#f0c040;}
    </style>
</head>
<body>
<div id="app"><div class="loading">⏳ 连接服务器中...</div></div>
<script>
(function() {
    const urlParams = new URLSearchParams(window.location.search);
    let role = urlParams.get('role');
    let ws = null;
    let gameState = null;
    let currentPlayer = null;
    let intervalId = null;
    let playerLoginRendered = false;
    const wsUrl = `${location.protocol==='https:'?'wss:':'ws:'}//${location.host}`;

    function showToast(msg) {
        const t = document.createElement('div'); t.className='toast'; t.innerText=msg;
        document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
    }
    function sendMessage(msg) { if(ws&&ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(msg)); }

    function startLocalTimers() {
        if(intervalId) clearInterval(intervalId);
        intervalId = setInterval(() => {
            if(!gameState) return;
            const act = gameState.currentActivity;
            if(act==='rush') {
                const r = gameState.rush;
                const el = document.getElementById('rushTimer');
                if(el) {
                    if(r.roundState==='RUSHING' && r.rushEndTime) el.textContent = `⏰ 抢答倒计时: ${Math.max(0,(r.rushEndTime-Date.now())/1000).toFixed(1)} 秒`;
                    else if(r.roundState==='ANSWERING' && r.answerEndTime) el.textContent = `✏️ 答题倒计时: ${Math.max(0,(r.answerEndTime-Date.now())/1000).toFixed(1)} 秒`;
                    else el.textContent = '';
                }
            } else if(act==='mutual') {
                const m = gameState.mutual;
                const el = document.getElementById('mutualTimer');
                if(el && m.roundActive && m.answerEndTime) el.textContent = `⌛ 答题倒计时: ${Math.max(0,(m.answerEndTime-Date.now())/1000).toFixed(1)} 秒`;
                else if(el) el.textContent = '';
            }
        }, 100);
    }

    function connectWebSocket() {
        ws = new WebSocket(wsUrl);
        ws.onopen = () => console.log('WS connected');
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if(data.type==='STATE') { gameState = data.state; renderFullPage(); startLocalTimers(); }
            else if(data.type==='ANSWER_RESULT') showToast(data.result.msg);
        };
        ws.onclose = () => setTimeout(connectWebSocket, 3000);
        ws.onerror = (err) => console.error(err);
    }

    function addHighlight(btn) { btn.classList.add('btn-highlight'); setTimeout(()=>btn.classList.remove('btn-highlight'),200); }
    function getMemberCount(teamId) { return (gameState?.teamMembers?.[teamId] || []).length; }
    function isTeamActive(teamId) { return gameState?.activeTeams?.includes(teamId); }

    function renderTeamCard(p) {
        if (!isTeamActive(p.id)) return '';
        const cnt = getMemberCount(p.id);
        return `<div class="team-card" style="border-left-color:${p.color}"><div>${p.emoji} ${p.name} <span class="member-count">${cnt}</span></div><div class="score-big">${p.score}</div></div>`;
    }

    // ============ 登录界面 ============
    function renderLogin() {
        if(document.getElementById('loginPage')) return;
        document.getElementById('app').innerHTML = `
            <div class="panel" id="loginPage" style="max-width:400px;margin:10vh auto;">
                <h1 style="font-size:2rem;text-align:center;">安全知识竞赛</h1>
                <button class="btn btn-primary" id="hostBtn" style="width:100%;margin:12px 0;">🎤 主持人</button>
                <button class="btn btn-outline" id="adminBtn" style="width:100%;margin-bottom:12px;">📊 管理员</button>
                <button class="btn btn-outline" id="playerBtn" style="width:100%;">👥 参赛选手</button>
                <div id="passwordDiv" class="hidden" style="margin-top:16px;">
                    <input type="password" id="password" placeholder="请输入密码">
                    <button class="btn btn-primary" id="submitPwd" style="width:100%;">确认</button>
                </div>
            </div>`;
        let targetRole = null;
        document.getElementById('hostBtn').onclick = () => { targetRole='host'; document.getElementById('passwordDiv').classList.remove('hidden'); addHighlight(document.getElementById('hostBtn')); };
        document.getElementById('adminBtn').onclick = () => { targetRole='admin'; document.getElementById('passwordDiv').classList.remove('hidden'); addHighlight(document.getElementById('adminBtn')); };
        document.getElementById('playerBtn').onclick = () => { addHighlight(document.getElementById('playerBtn')); setTimeout(()=> window.location.href='?role=player',200); };
        document.getElementById('submitPwd').onclick = () => {
            if(document.getElementById('password').value==='123') window.location.href=`?role=${targetRole}`;
            else alert('密码错误');
        };
    }

    // ============ 选手登录与主界面（不变，略）============
    function renderPlayerLogin() { /* 与之前相同 */ }
    function updateTeamSelectOptions() { /* 与之前相同 */ }
    function renderPlayerMain() { /* 与之前相同，需要处理 activityEnded 展示 */ }

    // ============ 主持人界面 ============
    function renderHost() {
        const act = gameState.currentActivity;
        const rush = gameState.rush, mutual = gameState.mutual;
        let bannerHtml = '';
        if (gameState.activityEnded) {
            bannerHtml = `<div class="result-banner end">🎉 本次活动到此结束，感谢大家参与！</div>`;
        } else {
            if(gameState.lastBuzzWinner?.timestamp+4000 > Date.now())
                bannerHtml += `<div class="result-banner buzz">🏆 ${gameState.lastBuzzWinner.teamName} 抢答成功</div>`;
            if(gameState.lastAnswerResult?.timestamp+4000 > Date.now()) {
                const cls = gameState.lastAnswerResult.isCorrect?'correct':'wrong';
                bannerHtml += `<div class="result-banner ${cls}">${gameState.lastAnswerResult.message}</div>`;
            }
        }
        let content = `<div class="panel">
            <div class="flex-row" style="justify-content:space-between;"><h2>🎙️ 主持人控制台</h2><button class="btn btn-outline btn-sm" id="logoutBtn">退出</button></div>
            <div class="flex-row" style="margin:16px 0;">
                <!-- 互问互答在左，抢答在右 -->
                <button class="btn ${act==='mutual'?'btn-primary':'btn-outline'}" id="selectMutual">互问互答</button>
                <button class="btn ${act==='rush'?'btn-primary':'btn-outline'}" id="selectRush">抢答活动</button>
            </div>
            <div class="phase-tip">${gameState.activityEnded ? '🏁 活动已结束' : (act==='rush'?'⚡抢答竞赛':mutual.phaseEnded?'🤝互问互答(已结束)':'🤝互问互答')}</div>
            ${bannerHtml}`;
        if (!gameState.activityEnded) {
            if(act==='rush') {
                if (rush.questionsExhausted) {
                    content += `<div class="question-area">
                        <div style="font-size:2rem;text-align:center;">📭 题库已空，无更多题目</div>
                        <button class="btn btn-primary" id="endActivityBtn" style="width:100%;margin-top:16px;">🏁 结束本次活动</button>
                    </div>`;
                } else {
                    content += `<div class="question-area">
                        <div>状态: ${rush.roundState==='IDLE'?'空闲':rush.roundState==='RUSHING'?'抢答中':rush.roundState==='ANSWERING'?'答题中':'已结束'}</div>
                        ${rush.currentQuestion?`<div class="q-text">${rush.currentQuestion.question}</div><div class="options">${rush.currentQuestion.options.map((o,i)=>`<div class="option">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div>`:'<div>暂无题目</div>'}
                        <div id="rushTimer" class="timer"></div>
                        <div class="flex-row" style="margin-top:12px;">
                            <button class="btn btn-primary" id="startRushBtn" ${rush.roundState!=='IDLE'?'disabled':''}>开始抢答 (40秒)</button>
                            <button class="btn btn-outline" id="skipRushBtn" ${(rush.roundState!=='RUSHING'&&rush.roundState!=='ANSWERING')?'disabled':''}>跳过本题</button>
                        </div></div>`;
                }
            } else {
                const drawTeam = gameState.players.find(p=>p.id===mutual.currentDrawTeamId);
                const answerTeam = gameState.players.find(p=>p.id===mutual.currentAnswerTeamId);
                content += `<div class="question-area">
                    <div class="phase-tip">🎲 ${drawTeam?.name} 抽题 → 🎯 ${answerTeam?.name} 答题</div>
                    ${mutual.roundActive?`<div class="q-text">${mutual.currentQuestion?.question}</div><div class="options">${mutual.currentQuestion?.options.map((o,i)=>`<div class="option">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}</div><div id="mutualTimer" class="timer"></div>`:'<div>等待抽题...</div>'}
                    <button class="btn btn-primary" id="drawBtn" ${(mutual.roundActive||mutual.phaseEnded)?'disabled':''}>📖 抽取题目</button></div>`;
            }
        }
        content += `<div class="team-grid">${gameState.players.map(renderTeamCard).join('')}</div></div>`;
        document.getElementById('app').innerHTML = content;
        if (!gameState.activityEnded) {
            document.getElementById('selectRush').onclick = () => { if(gameState.currentActivity!=='rush'&&confirm('切换到抢答？')) sendMessage({type:'HOST_ACTION',action:'selectActivity',payload:'rush'}); };
            document.getElementById('selectMutual').onclick = () => { if(gameState.currentActivity!=='mutual'&&confirm('切换到互问互答？')) sendMessage({type:'HOST_ACTION',action:'selectActivity',payload:'mutual'}); };
            if(act==='rush') {
                if (rush.questionsExhausted) {
                    document.getElementById('endActivityBtn').onclick = () => sendMessage({type:'HOST_ACTION',action:'endActivity'});
                } else {
                    document.getElementById('startRushBtn').onclick = () => sendMessage({type:'HOST_ACTION',action:'startRush'});
                    document.getElementById('skipRushBtn').onclick = () => sendMessage({type:'HOST_ACTION',action:'skipRush'});
                }
            } else {
                document.getElementById('drawBtn').onclick = () => { const btn=document.getElementById('drawBtn'); btn.classList.add('draw-anim'); sendMessage({type:'HOST_ACTION',action:'drawQuestion',payload:{drawTeamId:mutual.currentDrawTeamId}}); setTimeout(()=>btn.classList.remove('draw-anim'),600); };
            }
        }
        document.getElementById('logoutBtn').onclick = () => { window.location.href='/'; };
    }

    // 选手主界面也要处理 activityEnded
    function renderPlayerMain() {
        const player = gameState.players.find(p=>p.id===currentPlayer.id);
        if(!player) return;
        if (gameState.activityEnded) {
            document.getElementById('app').innerHTML = `<div class="panel"><div class="result-banner end">🎉 本次活动到此结束，感谢大家参与！</div></div>`;
            return;
        }
        // 其余代码不变（略）
    }

    // ============ 管理员界面 ============
    let adminTab = 'rushQuestions';
    async function renderAdmin() {
        const container = document.getElementById('app');
        container.innerHTML = `<div class="panel"><h2>📊 管理员后台</h2>
            <div class="flex-row" style="margin-bottom:16px;">
                <button class="tab-btn ${adminTab==='scores'?'active':''}" id="tabScores">🏆 分数总览</button>
                <button class="tab-btn ${adminTab==='rushQuestions'?'active':''}" id="tabRush">抢答题库</button>
                <button class="tab-btn ${adminTab==='mutualQuestions'?'active':''}" id="tabMutual">互问题库</button>
                <button class="tab-btn ${adminTab==='history'?'active':''}" id="tabHistory">答题记录</button>
                <button class="tab-btn ${adminTab==='members'?'active':''}" id="tabMembers">队伍成员</button>
            </div>
            <div id="adminContent">加载中...</div>
            <button class="btn btn-outline" id="adminLogout" style="margin-top:16px;">退出</button>
        </div>`;
        document.getElementById('adminLogout').onclick = () => window.location.href='/';
        document.getElementById('tabScores').onclick = () => { adminTab='scores'; renderAdminContent(); };
        document.getElementById('tabRush').onclick = () => { adminTab='rushQuestions'; renderAdminContent(); };
        document.getElementById('tabMutual').onclick = () => { adminTab='mutualQuestions'; renderAdminContent(); };
        document.getElementById('tabHistory').onclick = () => { adminTab='history'; renderAdminContent(); };
        document.getElementById('tabMembers').onclick = () => { adminTab='members'; renderAdminContent(); };
        renderAdminContent();
    }

    async function renderAdminContent() {
        const contentDiv = document.getElementById('adminContent');
        if(!contentDiv) return;
        if (adminTab === 'scores') {
            const scores = await fetch('/api/scores').then(r=>r.json());
            contentDiv.innerHTML = `<h3>🏆 队伍分数总览</h3>
            <table id="scoresTable">
                <tr><th>队伍</th><th>总分</th><th>队员名单</th></tr>
                ${scores.map(s=>`<tr><td>${s.emoji} ${s.name}</td><td>${s.score}</td><td>${s.members.join('、') || '无'}</td></tr>`).join('')}
            </table>
            <button class="btn btn-primary btn-sm" id="exportExcelBtn" style="margin-top:12px;">📥 导出 Excel</button>`;
            document.getElementById('exportExcelBtn').onclick = () => {
                const ws_data = [['队伍', '总分', '队员']];
                scores.forEach(s => ws_data.push([s.name, s.score, s.members.join('、')]));
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(ws_data);
                XLSX.utils.book_append_sheet(wb, ws, "分数总览");
                XLSX.writeFile(wb, "知识竞赛分数总览.xlsx");
            };
        } else if (adminTab === 'rushQuestions' || adminTab === 'mutualQuestions') {
            // 题库管理代码不变（略）
        } else if (adminTab === 'history') {
            // 历史记录代码不变（略）
        } else if (adminTab === 'members') {
            // 成员管理代码不变（略）
        }
    }

    function renderFullPage() {
        if(!gameState) return;
        if(role==='host') renderHost();
        else if(role==='player') {
            if(!currentPlayer) renderPlayerLogin();
            else renderPlayerMain();
        } else if(role==='admin') renderAdmin();
        else renderLogin();
    }

    connectWebSocket();
})();
</script>
</body>
</html>
